apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Module name
    required: true
  - name: COMPONENT
    description: Component name
    value: backend
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: IMAGE_TAG
    description: Image tag to use
    required: true
  - name: REGISTRY
    description: Container registry to import from
    value: ghcr.io
  - name: ORG_NAME
    description: Organization name
    value: bcgov
  - name: DOMAIN
    value: apps.gold.devops.gov.bc.ca
  - name: MIN_REPLICAS
    description: The minimum amount of replicas for the horizontal pod autoscaler.
    value: "2"
  - name: MAX_REPLICAS
    description: The maximum amount of replicas for the horizontal pod autoscaler.
    value: "5"
  - name: CPU_REQUEST
    value: "100m"
  - name: MEMORY_REQUEST
    value: "128Mi"
  - name: MEMORY_LIMIT
    description: Memory limit for the container (bounds the pod's working set).
    value: "4Gi"
  - name: LOG_LEVEL
    description: Application log level (debug|info|warn|error)
    value: "info"
  - name: VAULT_AGENT_PVC_NAME
    description: Name of the PVC rendered by the separate Vault Agent Helm chart.
    value: nodejs-vault-agent-vault-agent-secrets
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          terminationGracePeriodSeconds: 30
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        deployment: ${NAME}-${ZONE}-${COMPONENT}
                    topologyKey: kubernetes.io/hostname
          containers:
            - name: ${NAME}
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/${COMPONENT}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
              env:
                - name: LOG_LEVEL
                  value: ${LOG_LEVEL}
                - name: VAULT_AGENT_SECRET_FILE
                  value: /vault/output/service.env
                # dotenv/config (imported at app startup) auto-loads this file,
                # populating process.env.DB_USERNAME / DB_PASSWORD
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
                limits:
                  memory: ${MEMORY_LIMIT}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: vault-agent-output
                  mountPath: /vault/output
                  readOnly: true
              startupProbe:
                httpGet:
                  path: /api/health
                  port: http
                periodSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /api/health
                  port: http
                periodSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /api
                  port: http
                periodSeconds: 10
                failureThreshold: 3
              lifecycle:
                preStop:
                  exec:
                    # distroless/nodejs has no /bin/sleep; exec hooks skip image ENTRYPOINT
                    command: ["/nodejs/bin/node", "-e", "setTimeout(() => {}, 10000)"]
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            - name: vault-agent-output
              persistentVolumeClaim:
                claimName: ${VAULT_AGENT_PVC_NAME}
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: http
          port: 80
          targetPort: 3000
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}-allow-frontend
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      policyTypes:
        - Ingress
      ingress:
        # Same-tier "app" label is shared by both frontend and backend Deployments
        - from:
            - podSelector:
                matchLabels:
                  app: ${NAME}-${ZONE}
          ports:
            - protocol: TCP
              port: 3000
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}-${ZONE}-${COMPONENT}
      minReplicas: ${{MIN_REPLICAS}}
      maxReplicas: ${{MAX_REPLICAS}}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
          selectPolicy: Max
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
